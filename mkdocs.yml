site_name: IntelX
site_description: Documentation for IntelX, autonomous indoor exploration via local coverage gain prediction and structure-aware planning.
site_url: https://irvlutd.github.io/IntelX/docs/
repo_url: https://github.com/IRVLUTD/IntelX
repo_name: IRVLUTD/IntelX
copyright: Code under the MIT License. Intelligent Robotics and Vision Lab, The University of Texas at Dallas.
docs_dir: docs
use_directory_urls: true
exclude_docs: |
  requirements.txt
theme:
  name: material
  language: en
  font:
    text: IBM Plex Sans
    code: JetBrains Mono
  logo: assets/intelx-wordmark.svg
  favicon: assets/favicon.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.expand
    - navigation.path
    - navigation.top
    - navigation.footer
    - toc.integrate
    - toc.follow
    - content.code.copy
    - search.suggest
    - search.highlight
plugins:
  - search
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.details
  # the data, checkpoint and service pages are the READMEs beside them
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
extra_css:
  - stylesheets/extra.css
nav:
  - Start Here:
      - Overview: index.md
      - Get Started: getting-started.md
  - Run:
      - Running IntelX: running.md
      - The Benchmark: benchmark.md
      - MapEx Service: mapex-service.md
  - Data and Training:
      - Maps and Data: data.md
      - Checkpoint: weights.md
      - Training the Regressor: training.md
  - Reference:
      - Code Map: code.md
      - Citation and Licenses: citation.md
