[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "intelx"
version = "0.1.0"
description = "IntelX: Autonomous Indoor Exploration via Local Coverage Gain Prediction and Structure-Aware Planning"
authors = [
    { name = "Saurav Dosi" },
    { name = "Itay Kadosh" },
    { name = "Yu Xiang" },
]
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# The packages this tree actually imports, plus numba's CUDA target.
# requirements.txt pins the full environment the reported runs used.
dependencies = [
    "torch>=2.1",
    "torchvision>=0.16",
    "numpy>=1.24,<2.1",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "pandas>=2.0",
    "opencv-python>=4.8",
    "pillow>=10.0",
    "matplotlib>=3.7",
    "numba>=0.60",
    # the CUDA target the simulator's kernels need, with NVVM from pip
    "numba-cuda[cu12]>=0.30",
    "tqdm>=4.66",
    # training and the coverage dataset
    "h5py>=3.10",
    "accelerate>=1.0",
    "torchmetrics>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.4"]

[project.scripts]
intelx-run = "intelx.cli.run_intelx:main"
intelx-sweep = "intelx.cli.run_sweep_all:main"
intelx-method = "intelx.cli.run_method:main"
intelx-showcase = "intelx.viz.showcase:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
