name: documentation

# Publishes https://irvlutd.github.io/IntelX/: the project page at the site
# root, from the gh-pages branch, and this documentation under docs/. The
# publish workflow on gh-pages runs this one whenever the project page changes.
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "data/README.md"
      - "weights/README.md"
      - "services/README.md"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check out the project page
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: .website

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - name: Install MkDocs
        run: python -m pip install -r docs/requirements.txt
      - name: Build the documentation
        run: mkdocs build --strict --site-dir _site/docs
      - name: Add the project page at the site root
        run: rsync -a --exclude .git --exclude .github .website/ _site/
      - name: Verify published entry points
        run: |
          test -s _site/index.html
          grep -q 'IntelX' _site/index.html
          test -s _site/docs/index.html
          grep -q 'How much new space' _site/docs/index.html
          test -s _site/docs/getting-started/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
