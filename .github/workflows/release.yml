name: release

# A tag such as v0.1.0 builds the package and publishes a GitHub release with
# the sdist and the wheel attached, as RPX's release workflow does (without its
# PyPI step). The release text is .github/release-notes/<tag>.md when that
# file exists, followed by GitHub's generated changelog.
#
#     git tag -a v0.1.0 -m "IntelX v0.1.0"
#     git push origin v0.1.0
#
# Run by hand (workflow_dispatch), it only builds and checks the package.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build sdist + wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check the tag matches the package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          project="v$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          module="v$(python -c 'import re; print(re.search(r"__version__ = \"([^\"]+)\"", open("src/intelx/__init__.py").read()).group(1))')"
          if [ "$GITHUB_REF_NAME" != "$project" ] || [ "$GITHUB_REF_NAME" != "$module" ]; then
            echo "Tag $GITHUB_REF_NAME, pyproject.toml $project, intelx.__version__ $module: they must agree."
            exit 1
          fi

      - name: Build
        run: |
          python -m pip install --upgrade pip build
          python -m build

      # intelx imports nothing heavy at the top, so the wheel is checked
      # without torch or CUDA
      - name: Check the wheel installs and imports
        run: |
          python -m pip install --no-deps dist/*.whl
          python -c "import intelx; print('intelx', intelx.__version__)"

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

  github_release:
    name: Create GitHub release
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Release notes
        run: |
          notes=".github/release-notes/${GITHUB_REF_NAME}.md"
          if [ -f "$notes" ]; then cp "$notes" notes.md; else : > notes.md; fi

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: IntelX ${{ github.ref_name }}
          body_path: notes.md
          generate_release_notes: true
          files: dist/*
